name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Lint (includes file and function size limits)
        run: npm run lint
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: End-to-end smoke tests (system Google Chrome)
        run: npm run test:e2e
        env:
          CI: 'true'
